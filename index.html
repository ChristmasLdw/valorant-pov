<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无畏契约 POV 推荐</title>
    <style>
        :root {
            --primary: #ff4655;
            --bg-dark: #0a0e13;
            --bg-card: #111820;
            --bg-input: #0d1117;
            --text-primary: #e8e8e8;
            --text-secondary: #6b7a8d;
            --text-muted: #4a5568;
            --border: #1e2a3a;
            --accent-blue: #4fc3f7;
            --duelist: #ff6b6b;
            --initiator: #4ecdc4;
            --sentinel: #45b7d1;
            --controller: #a78bfa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 50px 20px 40px;
            background: radial-gradient(ellipse at 50% 0%, rgba(255,70,85,0.08) 0%, transparent 60%), linear-gradient(180deg, #111820 0%, var(--bg-dark) 100%);
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
            position: relative;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: var(--primary);
            border-radius: 1px;
        }
        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, var(--primary) 50%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        header p { color: var(--text-secondary); font-size: 0.9rem; letter-spacing: 1px; }
        .container { max-width: 1380px; margin: 0 auto; padding: 0 24px 60px; }

        /* Search */
        .search-top { margin-bottom: 20px; }
        .search-top label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 0.78rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        .search-top input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-top input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,70,85,0.1); }
        .search-top input::placeholder { color: var(--text-muted); }

        /* Filters */
        .filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px 24px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .filter-section { display: flex; align-items: flex-start; gap: 12px; }
        .filter-label {
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            min-width: 50px;
            padding-top: 6px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .filter-label:hover { color: var(--text-primary); }
        .filter-options { display: flex; flex-wrap: wrap; gap: 8px; }

        /* Agent Filters */
        .agents-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px 24px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .agents-filter-row > .filter-label { padding-top: 8px; margin-right: 4px; }
        .agents-filter-content { display: flex; flex-direction: column; gap: 12px; flex: 1; }
        .agent-role-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .agent-role-label {
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 50px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .agent-role-label:hover { color: var(--text-primary); }
        .agent-role-label.active { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
        .role-duelist .agent-role-label { color: var(--duelist); }
        .role-initiator .agent-role-label { color: var(--initiator); }
        .role-sentinel .agent-role-label { color: var(--sentinel); }
        .role-controller .agent-role-label { color: var(--controller); }
        .agent-role-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
        .filter-btn {
            padding: 6px 14px;
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            font-family: inherit;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); border-color: rgba(255,255,255,0.2); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: 600; }

        /* Results */
        .results-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #resultsCount { color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; }
        .reset-btn {
            padding: 8px 18px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-family: inherit;
            transition: all 0.2s;
        }
        .reset-btn:hover { color: var(--primary); border-color: var(--primary); background: rgba(255,70,85,0.05); }

        /* Grid */
        .agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }

        /* Card */
        .agent-card {
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s, box-shadow 0.35s;
            position: relative;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .agent-card:hover { transform: translateY(-6px); border-color: rgba(255,70,85,0.4); box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 30px rgba(255,70,85,0.06); }
        .agent-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: var(--hero-bg, none);
            background-size: cover;
            background-position: center 20%;
            opacity: 1;
            z-index: 0;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .agent-card:hover::before { transform: scale(1.05); }
        .agent-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(10,14,19,0.96) 0%, rgba(10,14,19,0.85) 30%, rgba(10,14,19,0.45) 50%, rgba(10,14,19,0.15) 65%, rgba(10,14,19,0.0) 80%);
            z-index: 1;
            pointer-events: none;
        }
        .agent-card > * { position: relative; z-index: 2; }
        .agent-header { padding: 18px 22px 14px; display: flex; align-items: center; gap: 14px; }
        .agent-info h3 { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 5px; color: #ffffff; }
        .role-badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .role-duelist { background: rgba(255,107,107,0.15); color: var(--duelist); border: 1px solid rgba(255,107,107,0.2); }
        .role-initiator { background: rgba(78,205,196,0.15); color: var(--initiator); border: 1px solid rgba(78,205,196,0.2); }
        .role-sentinel { background: rgba(69,183,209,0.15); color: var(--sentinel); border: 1px solid rgba(69,183,209,0.2); }
        .role-controller { background: rgba(167,139,250,0.15); color: var(--controller); border: 1px solid rgba(167,139,250,0.2); }
        .role-other { background: rgba(243,156,18,0.15); color: #f39c12; border: 1px solid rgba(243,156,18,0.2); }
        .agent-body { padding: 0 16px 16px; }
        .maps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

        /* Map Item */
        .map-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s;
        }
        .map-item:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 8px 25px rgba(0,0,0,0.3); border-color: rgba(255,70,85,0.25); }
        .map-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: var(--map-bg, none);
            background-size: cover;
            background-position: center;
            opacity: 0.35;
            z-index: 0;
            transition: opacity 0.3s, transform 0.4s;
        }
        .map-item:hover::before { opacity: 0.55; transform: scale(1.08); }
        .map-item::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(10,14,19,0.92) 0%, rgba(10,14,19,0.6) 45%, rgba(10,14,19,0.2) 70%, rgba(10,14,19,0.05) 100%);
            z-index: 1;
            pointer-events: none;
        }
        .map-item > * { position: relative; z-index: 2; }
        .map-name { color: var(--accent-blue); font-weight: 600; font-size: 0.8rem; padding: 8px 10px 0; }
        .players-list { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px 10px; }
        .player-tag {
            display: inline-block;
            padding: 3px 9px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 5px;
            font-size: 0.73rem;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .player-tag:hover { background: var(--primary); color: #ffffff; border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 3px 12px rgba(255,70,85,0.3); }

        .no-results { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .no-results h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text-secondary); }
        .no-results p { font-size: 0.9rem; }
        .loading { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--text-muted); font-size: 0.95rem; }

        @media (max-width: 768px) {
            header h1 { font-size: 1.6rem; }
            .agents-grid { grid-template-columns: 1fr; }
            .filters-row { padding: 16px; }
            .maps-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
        }
    </style>
</head>
<body>
    <header>
        <h1>VALORANT POV</h1>
        <p>职业选手第一视角解析 · By 圣诞ChristmasLdw</p>
    </header>

    <div class="container">
        <div class="search-top">
            <label>搜索</label>
            <input type="text" id="searchInput" placeholder="搜索英雄、选手..." oninput="filterData()">
        </div>

        <div class="filters-row">
            <div class="filter-section">
                <div class="filter-label" id="tutorialFilterLabel">新手教学</div>
                <div class="filter-options" id="tutorialOptions"></div>
            </div>
            <div class="filter-section">
                <div class="filter-label" id="mapFilterLabel">地图</div>
                <div class="filter-options" id="mapOptions"></div>
            </div>
        </div>

        <div class="agents-filter-row">
            <div class="filter-label" id="agentFilterLabel">英雄</div>
            <div class="agents-filter-content" id="agentFiltersByRole"></div>
        </div>

        <div class="results-bar">
            <span id="resultsCount"></span>
            <button class="reset-btn" onclick="resetFilters()">重置筛选</button>
        </div>

        <div class="agents-grid" id="agentsGrid">
            <div class="loading">正在加载数据...</div>
        </div>
    </div>

    <script>
        // Image Mappings
        const HERO_MAPPING = {"铁臂":1,"捷风":2,"雷兹":3,"幽影":4,"炼狱":5,"不死鸟":6,"贤者":7,"猎枭":8,"蝰蛇":9,"零":10,"芮娜":11,"奇乐":12,"斯凯":13,"夜露":14,"星礈":15,"K/O":16,"KAYO":16,"尚勃勒":17,"尚博勒":17,"霓虹":18,"黑梦":19,"海神":20,"盖可":21,"钢锁":22,"壹决":23,"暮蝶":24,"维斯":25,"钛狐":26,"幻棱":27,"禁灭":28,"迷核":29};
        const MAP_MAPPING = {"微风岛屿":"breeze","亚海悬城":"ascent","幽邃地窟":"abyss","源工重镇":"bind","莲华古城":"lotus","裂变峡谷":"fracture","森寒冬港":"icebox","深海明珠":"pearl","霓虹町":"split","隐世修所":"haven","日落之城":"sunset","盐海矿镇":"corrode"};
        const getHeroImageUrl = name => HERO_MAPPING[name] ? "https://game.gtimg.cn/images/val/agamezlk/bigpic/" + String(HERO_MAPPING[name]).padStart(2,'0') + ".png" : null;
        const getMapImageUrl = name => MAP_MAPPING[name] ? "https://game.gtimg.cn/images/val/agamezlk/map/" + MAP_MAPPING[name] + "/cover.PNG" : null;

        // Data
        let POV_DATA = [];
        const ROLES = ["决斗", "先锋", "哨卫", "控场"];
        const TUTORIALS = ["预瞄/思路", "找手感/爽局", "好玩有趣", "其他", "文字专栏"];

        // State
        let currentRole = '';
        let currentAgent = '';
        let currentTutorial = '';
        let currentMap = '';

        // Utilities
        const getAllMaps = () => [...new Set(POV_DATA.flatMap(i => Object.keys(i.maps)))].sort();
        const getAgentsByRole = () => {
            const result = {};
            ROLES.forEach(role => {
                result[role] = POV_DATA.filter(d => d.role === role).map(d => d.agent).sort();
            });
            return result;
        };
        const getRoleBadgeClass = role => {
            if (role.includes('决斗')) return 'role-duelist';
            if (role.includes('先锋')) return 'role-initiator';
            if (role.includes('哨卫')) return 'role-sentinel';
            if (role.includes('控场')) return 'role-controller';
            return 'role-other';
        };

        // Render
        function renderCards(data) {
            const grid = document.getElementById('agentsGrid');
            document.getElementById('resultsCount').textContent = '共 ' + data.length + ' 个英雄';

            if (data.length === 0) {
                grid.innerHTML = '<div class="no-results"><h3>暂无结果</h3><p>试试调整筛选条件</p></div>';
                return;
            }

            grid.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'agent-card';
                const heroImgUrl = getHeroImageUrl(item.agent);
                if (heroImgUrl) card.style.setProperty('--hero-bg', 'url(' + heroImgUrl + ')');

                const mapsHTML = Object.entries(item.maps).map(([mapName, players]) => {
                    const mapImgUrl = getMapImageUrl(mapName);
                    const mapStyle = mapImgUrl ? `style="--map-bg:url(${mapImgUrl})"` : '';
                    const playersHTML = players.map(p => `<a class="player-tag" href="${p.url}" target="_blank">${p.name}</a>`).join(' ');
                    return `<div class="map-item" ${mapStyle}><div class="map-name">${mapName}</div><div class="players-list">${playersHTML}</div></div>`;
                }).join('');

                card.innerHTML = `
                    <div class="agent-header">
                        <div class="agent-info">
                            <h3>${item.agent}</h3>
                            <span class="role-badge ${getRoleBadgeClass(item.role)}">${item.role}</span>
                        </div>
                    </div>
                    <div class="agent-body"><div class="maps-grid">${mapsHTML}</div></div>`;
                grid.appendChild(card);
            });
        }

        // Filter
        function filterData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = POV_DATA;

            if (currentRole) filtered = filtered.filter(d => d.role === currentRole);
            if (currentTutorial) filtered = filtered.filter(d => d.role === "一些新手教学" && d.agent === currentTutorial);
            if (currentAgent) filtered = filtered.filter(d => d.agent === currentAgent);
            if (currentMap) filtered = filtered.filter(d => d.maps[currentMap] && d.maps[currentMap].length > 0);
            if (search) filtered = filtered.filter(d =>
                d.agent.toLowerCase().includes(search) ||
                d.role.toLowerCase().includes(search) ||
                Object.values(d.maps).some(players => players.some(p => p.name.toLowerCase().includes(search)))
            );

            renderCards(filtered);
        }

        // Update UI
        function updateAllUI() {
            // Update role labels
            document.querySelectorAll('.agent-role-row .agent-role-label').forEach(label => {
                const role = label.parentElement.getAttribute('data-role');
                label.classList.toggle('active', role === currentRole);
            });
            // Update agent buttons
            document.querySelectorAll('.agent-role-buttons .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.agent === currentAgent);
            });
            // Update tutorial buttons
            document.querySelectorAll('#tutorialOptions .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.value === currentTutorial);
            });
            // Update map buttons
            document.querySelectorAll('#mapOptions .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.value === currentMap);
            });
        }

        // Reset
        function resetFilters() {
            currentRole = '';
            currentAgent = '';
            currentTutorial = '';
            currentMap = '';
            document.getElementById('searchInput').value = '';
            updateAllUI();
            renderCards(POV_DATA);
        }

        // Init
        function init() {
            // Agent filter label reset
            document.getElementById('agentFilterLabel').onclick = () => {
                currentAgent = '';
                currentRole = '';
                updateAllUI();
                filterData();
            };

            // Tutorial filter
            document.getElementById('tutorialFilterLabel').onclick = () => {
                currentTutorial = '';
                updateAllUI();
                filterData();
            };
            TUTORIALS.forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.value = val;
                btn.textContent = val;
                btn.onclick = () => {
                    currentTutorial = currentTutorial === val ? '' : val;
                    updateAllUI();
                    filterData();
                };
                document.getElementById('tutorialOptions').appendChild(btn);
            });

            // Map filter
            document.getElementById('mapFilterLabel').onclick = () => {
                currentMap = '';
                updateAllUI();
                filterData();
            };
            getAllMaps().forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.value = val;
                btn.textContent = val;
                btn.onclick = () => {
                    currentMap = currentMap === val ? '' : val;
                    updateAllUI();
                    filterData();
                };
                document.getElementById('mapOptions').appendChild(btn);
            });

            // Agent filters by role
            const container = document.getElementById('agentFiltersByRole');
            Object.entries(getAgentsByRole()).forEach(([role, agents]) => {
                if (!agents || agents.length === 0) return;

                const row = document.createElement('div');
                row.className = 'agent-role-row role-' + role.toLowerCase();
                row.dataset.role = role;

                const label = document.createElement('span');
                label.className = 'agent-role-label';
                label.textContent = role;
                label.onclick = () => {
                    currentRole = currentRole === role ? '' : role;
                    updateAllUI();
                    filterData();
                };
                row.appendChild(label);

                const buttons = document.createElement('div');
                buttons.className = 'agent-role-buttons';
                agents.forEach(agent => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.dataset.agent = agent;
                    btn.textContent = agent;
                    btn.onclick = () => {
                        currentAgent = currentAgent === agent ? '' : agent;
                        updateAllUI();
                        filterData();
                    };
                    buttons.appendChild(btn);
                });
                row.appendChild(buttons);
                container.appendChild(row);
            });
        }

        // Load
        fetch('full_pov_data.json')
            .then(res => res.json())
            .then(data => {
                POV_DATA = data;
                init();
                renderCards(POV_DATA);
            })
            .catch(err => {
                document.getElementById('agentsGrid').innerHTML = '<div class="no-results"><h3>数据加载失败</h3><p>请确保 full_pov_data.json 在同一目录下</p></div>';
                console.error('Failed to load POV data:', err);
            });
    </script>
</body>
</html>
